
{% extends "base.html" %}

{% block title %}
Login | Kharcha Book
{% endblock %}

{% block content %}

<div class="auth-wrap">

    <div class="form-card">

        <h2 class="fw-bold">
            Welcome back
        </h2>

        <p class="text-muted">
            Log in to view your transactions.
        </p>

        <form method="post">

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input
                    class="form-control"
                    name="email"
                    type="email"
                    required
                    autocomplete="email"
                >

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    class="form-control"
                    name="password"
                    type="password"
                    required
                    autocomplete="current-password"
                >

            </div>

            <button class="btn btn-primary w-100">
                Log in
            </button>

        </form>

        <p class="mt-3 mb-0 small">
            New here?
            <a href="{{ url_for('register') }}">
                Create an account
            </a>
        </p>

    </div>

</div>

{% endblock %}
