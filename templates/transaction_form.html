
{% extends "base.html" %}

{% block title %}
{{ 'Edit' if tx else 'Add' }} transaction | kharcha Book
{% endblock %}

{% block content %}

<div class="auth-wrap">

    <div class="form-card wide">

        <h2 class="fw-bold">
            {{ 'Edit transaction' if tx else 'Add a transaction' }}
        </h2>

        <p class="text-muted">
            Record an income or expense.
        </p>

        <form method="post">

            <div class="mb-3">

                <label class="form-label">
                    Transaction type
                </label>

                <select
                    class="form-select"
                    id="kind"
                    name="kind"
                    required
                >

                    <option
                        value="Expense"
                        {{ 'selected' if tx and tx.kind == 'Expense' }}
                    >
                        Expense
                    </option>

                    <option
                        value="Income"
                        {{ 'selected' if tx and tx.kind == 'Income' }}
                    >
                        Income
                    </option>

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Category
                </label>

                <select
                    class="form-select"
                    id="category_id"
                    name="category_id"
                    required
                >

                    {% for c in categories %}

                    <option
                        value="{{ c.id }}"
                        data-kind="{{ c.kind }}"
                        {{ 'selected' if tx and tx.category_id == c.id }}
                    >
                        {{ c.name }} ({{ c.kind }})
                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Amount (₹)
                </label>

                <input
                    class="form-control"
                    name="amount"
                    type="number"
                    min="0.01"
                    max="1000000000"
                    step="0.01"
                    value="{{ '%.2f'|format(tx.amount_paise/100) if tx else '' }}"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Date
                </label>

                <input
                    class="form-control"
                    name="transaction_date"
                    type="date"
                    value="{{ tx.transaction_date if tx else today }}"
                    required
                >

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Description (optional)
                </label>

                <textarea
                    class="form-control"
                    name="description"
                    rows="3"
                    maxlength="300"
                >{{ tx.description if tx else '' }}</textarea>

            </div>

            <div class="d-flex gap-2">

                <button class="btn btn-primary">
                    {{ 'Save changes' if tx else 'Add transaction' }}
                </button>

                <a
                    class="btn btn-outline-secondary"
                    href="{{ url_for('transactions') }}"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}

{% block scripts %}

<script>

const kind = document.getElementById('kind');

const category = document.getElementById('category_id');

function filterCategories() {

    const options = [...category.options];

    options.forEach(o => {
        o.hidden = o.dataset.kind !== kind.value;
    });

    const current = category.selectedOptions[0];

    if (!current || current.dataset.kind !== kind.value) {

        const first = options.find(
            o => o.dataset.kind === kind.value
        );

        if (first) {
            category.value = first.value;
        }

    }

}

kind.addEventListener('change', filterCategories);

filterCategories();

</script>

{% endblock %}
