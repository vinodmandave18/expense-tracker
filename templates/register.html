
{% extends "base.html" %}

{% block title %}Create Account | Kharcha Book{% endblock %}

{% block content %}

<div class="auth-wrap">
    <div class="form-card">

        <h2 class="fw-bold">Create your account</h2>

        <p class="text-muted">
            Start organizing your finances.
        </p>

        <form method="post">

            <div class="mb-3">
                <label class="form-label">Full name</label>
                <input
                    class="form-control"
                    name="name"
                    type="text"
                    required
                    maxlength="80"
                    autocomplete="name"
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input
                    class="form-control"
                    name="email"
                    type="email"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input
                    class="form-control"
                    name="password"
                    type="password"
                    minlength="8"
                    required
                    autocomplete="new-password"
                >

                <div class="form-text">
                    Use at least 8 characters.
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Create Account
            </button>

        </form>

        <p class="mt-3 mb-0 small">
            Already registered?
            <a href="{{ url_for('login') }}">Sign in</a>
        </p>

    </div>
</div>

{% endblock %}
